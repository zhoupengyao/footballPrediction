name: Validate web and exporter

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'data/manual_results/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install minimal deps
        run: pip install pandas numpy pyyaml

      - name: Run exporter and reconciliation tests
        run: |
          python tests/test_reconcile.py
          python tests/test_export_web.py
          python tests/test_analysis.py
          python tests/test_jingcai_results.py

      - name: Check committed site JSON
        run: |
          python -c "from src.web_export import check_output; print('JSON files:', check_output('web/public/data'))"

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
